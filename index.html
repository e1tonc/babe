<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王依晴 🎮 8-BIT TIMER</title>
    <!-- 8-Bit Pixel Fonts & Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* 8-Bit Pixel Styling */
        body {
            font-family: 'DotGothic16', monospace;
            background-color: #080c1a;
            color: #ffffff;
            image-rendering: pixelated;
            user-select: none;
            overflow-x: hidden;
        }

        .pixel-font-en {
            font-family: 'Press Start 2P', monospace;
        }

        /* 8-Bit Retro Box Borders */
        .pixel-box {
            background: #0d162f;
            border: 4px solid #ffffff;
            box-shadow: 6px 6px 0px #00f5d4, -4px -4px 0px #000000 inset;
            position: relative;
        }

        .pixel-box-pink {
            background: #1a0d24;
            border: 4px solid #ff85a1;
            box-shadow: 6px 6px 0px #ff0055;
        }

        /* 8-Bit Giyu Haori Pattern Top Strip */
        .giyu-pixel-bar {
            height: 12px;
            width: 100%;
            background-image: repeating-linear-gradient(
                90deg,
                #8b0000 0px, #8b0000 16px,
                #facc15 16px, #facc15 32px,
                #15803d 32px, #15803d 48px,
                #000000 48px, #000000 52px
            );
            border-bottom: 3px solid #000;
        }

        /* Canvas background for retro pixel particles */
        #pixelCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Retro Ticking Pulse for Seconds */
        @keyframes pixelTick {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); color: #ff0055; }
            100% { transform: scale(1); }
        }

        .tick-second {
            animation: pixelTick 1s steps(1) infinite;
        }

        /* Pixel Button Press Effect */
        .pixel-btn {
            background: #00f5d4;
            color: #000000;
            border: 3px solid #ffffff;
            box-shadow: 4px 4px 0px #000000;
            font-weight: bold;
        }
        .pixel-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0px #000000;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative" onclick="playBeep()">

    <canvas id="pixelCanvas"></canvas>

    <!-- Top 8-Bit Giyu Haori Ribbon -->
    <div class="giyu-pixel-bar sticky top-0 z-50"></div>

    <!-- Main Content -->
    <main class="relative z-10 max-w-2xl mx-auto px-4 py-8 flex-grow flex flex-col items-center justify-center text-center space-y-8">

        <!-- Header Badge -->
        <div class="pixel-box p-3 inline-flex items-center gap-3">
            <span class="text-xl">🌊</span>
            <span class="text-xs sm:text-sm text-cyan-300 font-bold tracking-widest">
                PLAYER 1: 王依晴
            </span>
            <span class="text-xl">💖</span>
        </div>

        <!-- Main Title -->
        <div class="space-y-2">
            <h1 class="text-4xl sm:text-6xl font-black text-yellow-300 tracking-wider">
                王依晴
            </h1>
            <p class="text-base sm:text-lg text-cyan-300 font-bold">
                [ 2024.06.22 - FOREVER ]
            </p>
        </div>

        <!-- Core 8-Bit Timer Display -->
        <section class="pixel-box p-6 sm:p-8 w-full space-y-6">
            <div class="text-xs sm:text-sm text-pink-400 font-bold tracking-widest uppercase flex items-center justify-center gap-2">
                <span>▲</span>
                <span>在一起的时间计数</span>
                <span>▲</span>
            </div>

            <!-- Big Number Timer Grid -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 text-center">
                <!-- Days -->
                <div class="bg-black/60 border-2 border-cyan-400 p-3">
                    <div id="days" class="text-3xl sm:text-4xl font-bold text-cyan-300 pixel-font-en">000</div>
                    <div class="text-xs text-slate-400 mt-1">DAYS</div>
                </div>
                <!-- Hours -->
                <div class="bg-black/60 border-2 border-cyan-400 p-3">
                    <div id="hours" class="text-3xl sm:text-4xl font-bold text-cyan-300 pixel-font-en">00</div>
                    <div class="text-xs text-slate-400 mt-1">HOURS</div>
                </div>
                <!-- Minutes -->
                <div class="bg-black/60 border-2 border-cyan-400 p-3">
                    <div id="minutes" class="text-3xl sm:text-4xl font-bold text-cyan-300 pixel-font-en">00</div>
                    <div class="text-xs text-slate-400 mt-1">MINS</div>
                </div>
                <!-- Seconds -->
                <div class="bg-black/60 border-2 border-pink-500 p-3">
                    <div id="seconds" class="text-3xl sm:text-4xl font-bold text-pink-400 pixel-font-en tick-second">00</div>
                    <div class="text-xs text-pink-400 mt-1">SECS</div>
                </div>
            </div>

            <!-- Exact Timestamp -->
            <div class="text-xs text-slate-400 font-mono pt-2 border-t border-slate-700">
                计时起点：2024年06月22日 凌晨 01:44
            </div>
        </section>

        <!-- 8-Bit Pixel Giyu Badge -->
        <section class="pixel-box-pink p-4 w-full flex items-center justify-between text-left">
            <div class="flex items-center gap-3">
                <div class="text-3xl">⚔️</div>
                <div>
                    <div class="text-xs text-pink-300 font-bold">水柱 · 富冈义勇</div>
                    <div class="text-sm font-bold text-yellow-300 mt-0.5">专属守护玩家：王依晴</div>
                </div>
            </div>
            <button onclick="pressHeartButton()" class="pixel-btn text-xs px-3 py-2 cursor-pointer">
                ❤️ PRESS
            </button>
        </section>

    </main>

    <!-- Bottom Ribbon & Simple Footer -->
    <footer class="relative z-10 py-4 text-center text-xs text-slate-500 space-y-2">
        <p>GAME OVER? NEVER. 👾</p>
        <div class="giyu-pixel-bar"></div>
    </footer>

    <script>
        // Exact Start Date: June 22, 2024 at 1:44 AM
        const startDate = new Date('2024-06-22T01:44:00');

        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;

            if (diff < 0) return;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / (1000 * 60)) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById('days').innerText = String(days).padStart(3, '0');
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
            document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
        }

        setInterval(updateTimer, 1000);
        updateTimer();

        // 8-Bit Retro Chiptune Beep
        function playBeep(freq = 440) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'square'; // 8-bit square wave
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch(e){}
        }

        function pressHeartButton() {
            playBeep(880);
            confetti({
                particleCount: 40,
                spread: 60,
                origin: { y: 0.8 },
                colors: ['#00f5d4', '#ff85a1', '#facc15']
            });
        }

        // 8-Bit Pixel Particle Canvas
        const canvas = document.getElementById('pixelCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const pixels = [];
        const count = 30;

        class PixelParticle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.floor(Math.random() * canvas.width);
                this.y = canvas.height + Math.random() * 50;
                this.size = Math.floor(Math.random() * 4 + 4); // Pixel squares
                this.speedY = Math.random() * 1 + 0.5;
                this.color = ['#00f5d4', '#ff85a1', '#facc15', '#3b82f6'][Math.floor(Math.random() * 4)];
            }
            update() {
                this.y -= this.speedY;
                if (this.y < -10) this.reset();
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);
            }
        }

        for (let i = 0; i < count; i++) pixels.push(new PixelParticle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            pixels.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
