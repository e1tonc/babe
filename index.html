<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>王依晴 8-BIT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🌊%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+SC:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --night:#050818; --sea:#0b1a3a; --cyan:#00f5d4; --pink:#ff85a1; --hot:#ff0055; --gold:#facc15;
  --panel:#0d162f; --ink:#ffffff; --mute:#8aa0c8;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{
  margin:0;min-height:100%;color:var(--ink);overflow-x:hidden;user-select:none;-webkit-user-select:none;
  font-family:'DotGothic16','Noto Sans SC','PingFang SC','Microsoft YaHei',monospace;
  background:linear-gradient(var(--night),var(--sea) 60%,#0d2a4a);background-attachment:fixed;
  padding-top:env(safe-area-inset-top,0px);
}
canvas.layer{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
#bg{z-index:0}
#front{z-index:4}
.en{font-family:'Press Start 2P','Courier New',monospace;font-weight:700}

/* Top ribbon: left half plain, right half patterned (haori style) */
.ribbon{position:fixed;top:0;left:0;right:0;height:12px;z-index:6;display:flex;border-bottom:3px solid #000}
.ribbon i{flex:1;background:#17382b}
.ribbon b{flex:1;background:repeating-linear-gradient(90deg,#d8402c 0 12px,#facc15 12px 24px,#2ec4b6 24px 36px,#f6efdc 36px 48px)}

.vert{position:fixed;left:clamp(10px,3vw,40px);top:80px;z-index:2;writing-mode:vertical-rl;
  color:var(--pink);font-size:clamp(14px,2vw,20px);letter-spacing:.4em;text-shadow:2px 2px 0 #000}

main{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:26px;padding:44px 22px 210px;text-align:center}

/* pixel frame: stepped corners made of box-shadows */
.px{background:var(--panel);margin:4px;
  box-shadow:0 -4px 0 0 #fff,0 4px 0 0 #fff,-4px 0 0 0 #fff,4px 0 0 0 #fff,8px 8px 0 0 #00f5d466}

.badge{padding:10px 16px;font-size:13px;color:var(--cyan);display:inline-flex;gap:10px;align-items:center}
.name{margin:0;font-size:clamp(52px,15vw,104px);font-weight:400;color:var(--gold);letter-spacing:.06em;
  text-shadow:4px 4px 0 var(--hot),8px 8px 0 #000;line-height:1.1}
.since{margin:0;color:var(--cyan);font-size:clamp(12px,2.6vw,16px);letter-spacing:.14em}

.timer{width:min(640px,100%);padding:22px clamp(12px,3vw,26px) 20px}
.hd{font-size:13px;color:var(--pink);letter-spacing:.2em;margin-bottom:14px}
.big{font-size:clamp(15px,3.6vw,22px);line-height:2;margin:0 0 16px}
.big .en{font-size:clamp(24px,6.4vw,40px);color:var(--cyan);margin:0 6px;text-shadow:3px 3px 0 #000}
.clock{display:flex;justify-content:center;align-items:center;gap:clamp(4px,1.6vw,12px)}
.cell{background:#000a;border:3px solid var(--cyan);padding:12px clamp(6px,2vw,14px) 8px;min-width:clamp(64px,19vw,116px)}
.cell:last-of-type{border-color:var(--pink)}
.num{display:block;font-size:clamp(22px,6.6vw,42px);color:var(--cyan)}
.cell:last-of-type .num{color:var(--pink)}
.lab{display:block;margin-top:10px;font-size:12px;color:var(--mute)}
.sep{font-size:clamp(18px,5vw,30px);color:var(--gold);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.total{margin:16px 0 0;padding-top:12px;border-top:3px dashed #ffffff33;color:var(--mute);font-size:14px}
.total b{color:var(--gold);font-weight:400}

.go{font:inherit;font-size:16px;letter-spacing:.14em;color:#000;background:var(--cyan);border:0;cursor:pointer;
  padding:14px 22px;margin:4px;box-shadow:0 -4px 0 0 #fff,0 4px 0 0 #fff,-4px 0 0 0 #fff,4px 0 0 0 #fff,8px 8px 0 0 #000}
.go:hover{background:var(--gold)}
.go:active{transform:translate(4px,4px);box-shadow:0 -4px 0 0 #fff,0 4px 0 0 #fff,-4px 0 0 0 #fff,4px 0 0 0 #fff}
.go:focus-visible{outline:4px solid var(--pink);outline-offset:6px}

/* Walking sprite */
.walker{position:fixed;left:0;bottom:20px;z-index:3;width:120px;height:120px;will-change:transform}
.hop{width:100%;height:100%}
.hop.jump{animation:jump .5s steps(8)}
@keyframes jump{50%{transform:translateY(-64px)}}
.flip{position:relative;width:100%;height:100%}
.bob{position:relative;width:100%;height:100%;animation:bob .6s steps(1) infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.bob canvas{position:absolute;image-rendering:pixelated}
#body{left:0;top:0;width:96px;height:120px}
#sword{left:90px;top:0;width:24px;height:90px;transform-origin:50% 88%;animation:gleam 2.4s steps(1) infinite}
#sword.swing{animation:swing .45s steps(5)}
@keyframes gleam{0%,86%{filter:none}90%{filter:brightness(2.2)}96%{filter:none}}
@keyframes swing{0%{transform:rotate(0)}45%{transform:rotate(110deg)}100%{transform:rotate(0)}}
.custom{position:absolute;left:0;top:0;height:120px;image-rendering:pixelated}
.bubble{position:absolute;left:50%;top:-44px;transform:translateX(-50%);white-space:nowrap;display:none;
  background:#fff;color:#000;padding:6px 10px;font-size:14px;box-shadow:4px 4px 0 #000}
.bubble.on{display:block}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-4px;border:4px solid transparent;border-top-color:#fff;border-width:8px 6px 0}

@media (max-width:560px){.vert{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas class="layer" id="bg"></canvas>
<div class="ribbon" aria-hidden="true"><i></i><b></b></div>
<div class="vert">火星人的来时路~</div>

<main>
  <div class="px badge en"><span>🌊</span><span>PLAYER 1</span><span>💖</span></div>

  <div>
    <h1 class="name">王依晴</h1>
    <p class="since">[ 2026.06.22 01:44 - FOREVER ]</p>
  </div>

  <section class="px timer">
    <div class="hd">▲ 在一起的时间计数 ▲</div>
    <p class="big">已经 <span class="en" id="mo">0</span>个月 <span class="en" id="dy">0</span>天</p>
    <div class="clock" role="timer" aria-live="off">
      <div class="cell"><span class="num en" id="hh">00</span><span class="lab">HOURS</span></div>
      <span class="sep en">:</span>
      <div class="cell"><span class="num en" id="mm">00</span><span class="lab">MINS</span></div>
      <span class="sep en">:</span>
      <div class="cell"><span class="num en" id="ss">00</span><span class="lab">SECS</span></div>
    </div>
    <p class="total">TOTAL <b id="td">0</b> 天 / <b id="th">0</b> 小时</p>
  </section>

  <button class="go" id="btn">火星人的来时路~</button>
</main>

<div class="walker" id="walker">
  <div class="bubble" id="bubble">火星人的来时路~</div>
  <div class="hop" id="hop"><div class="flip" id="flip"><div class="bob" id="bob">
    <canvas id="body" width="16" height="20"></canvas>
    <canvas id="sword" width="4" height="15"></canvas>
  </div></div></div>
</div>
<canvas class="layer" id="front"></canvas>

<script>
/* ===== Timer =====
   Counts from 1:44am, 22 June 2026 in the time zone below, so every device
   shows the same numbers. If that moment was in another zone, change TZ
   (for example 'Asia/Kuala_Lumpur'). */
const TZ = 'Australia/Melbourne';
const START_WALL = Date.UTC(2026, 5, 22, 1, 44, 0); // wall-clock time in TZ
const zoneFmt = new Intl.DateTimeFormat('en-GB', {
  timeZone: TZ, hourCycle: 'h23',
  year: 'numeric', month: 'numeric', day: 'numeric',
  hour: 'numeric', minute: 'numeric', second: 'numeric'
});
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');

function wallNow(){
  const p = {};
  for (const part of zoneFmt.formatToParts(new Date())) p[part.type] = +part.value;
  return Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second);
}
function compute(now){
  if (now < START_WALL) return {mo: 0, dy: 0, h: 0, m: 0, s: 0, td: 0, th: 0};
  const s = new Date(START_WALL), n = new Date(now);
  const at = k => { const d = new Date(START_WALL); d.setUTCMonth(s.getUTCMonth() + k); return d.getTime(); };
  let mo = (n.getUTCFullYear() - s.getUTCFullYear()) * 12 + n.getUTCMonth() - s.getUTCMonth();
  if (at(mo) > now) mo--;
  const rest = now - at(mo), total = now - START_WALL;
  return {
    mo: mo, dy: Math.floor(rest / 864e5), h: Math.floor(rest / 36e5) % 24,
    m: Math.floor(rest / 6e4) % 60, s: Math.floor(rest / 1e3) % 60,
    td: Math.floor(total / 864e5), th: Math.floor(total / 36e5)
  };
}
function tick(){
  const r = compute(wallNow());
  $('mo').textContent = r.mo;
  $('dy').textContent = r.dy;
  $('hh').textContent = pad(r.h);
  $('mm').textContent = pad(r.m);
  $('ss').textContent = pad(r.s);
  $('td').textContent = r.td;
  $('th').textContent = r.th.toLocaleString();
}
tick(); setInterval(tick, 250);

/* ===== Pixel sprite (original swordsman, water-breathing style) =====
   To use your own 8-bit image instead, put its URL or data: URI below. */
const CUSTOM_SPRITE = '';

const PAL = {H:'#1b2340',S:'#f3cfa6',E:'#2a6df4',M:'#b5533c',G:'#1c5a3c',W:'#f6efdc',R:'#d8402c',
  Y:'#f0c35a',T:'#2ec4b6',B:'#1a1a2e',b:'#2c2f55',K:'#0a0a14',C:'#9ff1e6'};
const TOP = [
 ".....HHHHHH.....",
 "....HHHHHHHH....",
 "...HHHHHHHHHH...",
 "...HHHSSSSHHH...",
 "..HHSSESSESSHH..",
 "..HHSSSMMSSSHH..",
 "..HH.SSSSSS.HH..",
 "..GGGGGWWYRYRY..",
 ".GGGGGGWWRYRYRY.",
 ".GGGGGGWWTWTWTW.",
 ".GGGGGGWWRYRYRY.",
 ".SGGGGGWWYRYRYS.",
 "..BBBBBYYBBBBB..",
 "..bbbbbbbbbbbb..",
 "..bbbbbbbbbbbb.."];
const LEGS = [
 ["..bbbbb..bbbbb..","..bbbbb..bbbbb..","..WWWWW..WWWWW..","..KKKKK..KKKKK..","................"],
 ["..bbbb....bbbb..",".bbbb......bbbb.",".WWWW......WWWW.",".KKKK......KKKK.","................"]];
const SWORD = ["..W.",".CW.",".CW.",".CW.",".CW.",".CW.",".CW.",".CW.",".CW.",".CW.","YYYY",".RR.",".BB.",".RR.",".YY."];

function paint(cv, rows, blink){
  const c = cv.getContext('2d'); c.clearRect(0, 0, cv.width, cv.height);
  rows.forEach((r, y) => [...r].forEach((k, x) => {
    if (blink && k === 'E') k = 'S';
    if (k !== '.'){ c.fillStyle = PAL[k]; c.fillRect(x, y, 1, 1); }
  }));
}
let stride = 0, blink = false;
const drawBody = () => paint($('body'), TOP.concat(LEGS[stride]), blink);
drawBody(); paint($('sword'), SWORD);
if (CUSTOM_SPRITE){
  const im = new Image(); im.src = CUSTOM_SPRITE; im.className = 'custom'; im.alt = '';
  $('bob').replaceChildren(im);
}
setInterval(() => { blink = true; drawBody(); setTimeout(() => { blink = false; drawBody(); }, 140); }, 3200);

/* ===== Walking ===== */
const walker = $('walker'), flip = $('flip'), bubble = $('bubble');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let x = 30, dir = 1, pause = 0, n = 0;
function step(){
  const maxX = Math.max(60, innerWidth - 150);
  if (!still){
    if (pause > 0){ pause--; if (stride){ stride = 0; drawBody(); } }
    else {
      x += dir * 1.5;
      if (x >= maxX){ dir = -1; pause = 110; }
      if (x <= 20){ dir = 1; pause = 110; }
      if (++n % 10 === 0 && !CUSTOM_SPRITE){ stride ^= 1; drawBody(); }
    }
  }
  walker.style.transform = `translateX(${Math.round(x)}px)`;
  flip.style.transform = `scaleX(${dir})`;
  requestAnimationFrame(step);
}
step();

function say(){
  bubble.classList.add('on'); clearTimeout(say.t);
  say.t = setTimeout(() => bubble.classList.remove('on'), 1800);
}
function hopUp(){
  const h = $('hop'); h.classList.remove('jump'); void h.offsetWidth; h.classList.add('jump');
}
function swing(){
  const s = $('sword'); s.classList.remove('swing'); void s.offsetWidth; s.classList.add('swing');
}
walker.addEventListener('pointerdown', e => { e.stopPropagation(); hopUp(); say(); });

/* ===== Pixel canvases (1 canvas px = 4 screen px) ===== */
const P = 4, bg = $('bg'), fr = $('front'), bx = bg.getContext('2d'), fx = fr.getContext('2d');
let W, H, stars = [], bubbles = [], t = 0;
const splash = [], slashes = [];
function size(){
  W = Math.ceil(innerWidth / P); H = Math.ceil(innerHeight / P);
  bg.width = fr.width = W; bg.height = fr.height = H;
  stars = Array.from({length: Math.round(W * H / 260)}, () => ({
    x: Math.floor(Math.random() * W), y: Math.floor(Math.random() * H * .62), p: Math.random() * 3,
    s: Math.random() < .2 ? 2 : 1, c: ['#ffffff','#bff3ea','#ffe9a8'][Math.floor(Math.random() * 3)]}));
  bubbles = Array.from({length: 22}, () => newBubble(true));
}
function newBubble(init){
  return {x: Math.floor(Math.random() * W), y: init ? Math.random() * H : H + 2, v: Math.random() * .25 + .1, s: Math.random() * 6};
}
addEventListener('resize', size); size();

function wave(c, y0, amp, wl, sp, col, crest){
  for (let i = 0; i < W; i++){
    const s = Math.sin(i / wl + t * sp), top = y0 + Math.round(s * amp);
    c.fillStyle = col; c.fillRect(i, top, 1, H - top);
    if (crest && s > .8){ c.fillStyle = '#8ff5e6'; c.fillRect(i, top, 1, 1); }
  }
}
function moon(c, mx, my, r){
  for (let dy = -r; dy <= r; dy++){
    const h = Math.floor(Math.sqrt(r * r - dy * dy));
    c.fillStyle = '#fdf6c8'; c.fillRect(mx - h, my + dy, h * 2 + 1, 1);
  }
  c.fillStyle = '#e4d894';
  c.fillRect(mx - 3, my - 3, 3, 2); c.fillRect(mx + 2, my + 1, 3, 3); c.fillRect(mx - 4, my + 3, 2, 2);
}
function draw(){
  t++;
  bx.clearRect(0, 0, W, H);
  for (const s of stars){
    if ((Math.floor(t / 24 + s.p) % 3) !== 0){ bx.fillStyle = s.c; bx.fillRect(s.x, s.y, s.s, s.s); }
  }
  moon(bx, Math.round(W * .84), Math.round(H * .16) + 6, 8);
  for (const b of bubbles){
    b.y -= b.v; if (b.y < -2){ Object.assign(b, newBubble(false)); }
    bx.fillStyle = '#bff3ea88'; bx.fillRect(Math.round(b.x + Math.sin(t / 30 + b.s) * 1.5), Math.round(b.y), 1, 1);
  }
  wave(bx, H - 20, 2, 5, .03, '#0f5f73', false);
  wave(bx, H - 14, 2, 4, -.04, '#0a4256', false);

  fx.clearRect(0, 0, W, H);
  wave(fx, H - 9, 2, 3.5, .05, '#052436', true);

  for (let i = slashes.length - 1; i >= 0; i--){
    const s = slashes[i]; s.t += .06;
    if (s.t > 1.6){ slashes.splice(i, 1); continue; }
    const reach = Math.min(1, s.t * 1.8) * W, alpha = Math.max(0, 1.6 - s.t);
    for (let i2 = 0; i2 < reach; i2++){
      const y = Math.round(s.y0 + (i2 / W) * (s.y1 - s.y0));
      fx.globalAlpha = alpha; fx.fillStyle = '#ffffff'; fx.fillRect(i2, y, 1, 2);
      fx.fillStyle = '#00f5d4'; fx.fillRect(i2, y + 2, 1, 1);
    }
    fx.globalAlpha = 1;
  }
  for (let i = splash.length - 1; i >= 0; i--){
    const p = splash[i];
    p.x += p.vx; p.y += p.vy; p.vy += .12; p.l -= .018;
    if (p.l <= 0){ splash.splice(i, 1); continue; }
    fx.globalAlpha = p.l; fx.fillStyle = p.c; fx.fillRect(Math.round(p.x), Math.round(p.y), p.z, p.z);
  }
  fx.globalAlpha = 1;
  requestAnimationFrame(draw);
}
draw();

function burst(px, py){
  const cols = ['#00f5d4','#ff85a1','#facc15','#ffffff'];
  for (let i = 0; i < 40; i++){
    const a = Math.random() * 6.283, v = Math.random() * 2.2 + .6;
    splash.push({x: px / P, y: py / P, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.2, l: 1, z: Math.random() < .3 ? 2 : 1, c: cols[i % 4]});
  }
}
function slash(y){
  const yy = y / P;
  slashes.push({t: 0, y0: yy + 14, y1: yy - 14});
}

$('btn').addEventListener('click', e => {
  const r = e.currentTarget.getBoundingClientRect();
  slash(r.top + r.height / 2); swing(); hopUp(); say();
  setTimeout(() => burst(r.left + r.width / 2, r.top + r.height / 2), 260);
});
addEventListener('pointerdown', e => { if (!e.target.closest('#btn')) burst(e.clientX, e.clientY); });
setTimeout(() => slash(innerHeight * .3), 500);
</script>
</body>
</html>
