    <style>
        @import url('[https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&family=Noto+Sans+SC:wght@500;700;900&display=swap](https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&family=Noto+Sans+SC:wght@500;700;900&display=swap)');

        /* STREAMING_CHUNK: Configuring custom color palette, Giyu Haori accents, and animations */
        :root {
            --giyu-red: #8b1528;
            --giyu-yellow: #facc15;
            --giyu-green: #15803d;
            --water-cyan: #00f5d4;
            --water-blue: #3b82f6;
            --deep-ocean: #0b132b;
            --pastel-pink: #ff85a1;
        }

        body {
            font-family: 'M PLUS Rounded 1c', 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #0b132b 0%, #1c2541 50%, #0f172a 100%);
            color: #ffffff;
            min-h: 100vh;
            overflow-x: hidden;
            user-select: none;
        }

        /* Giyu Split Haori Ribbon Border */
        .giyu-haori-bar {
            height: 10px;
            width: 100%;
            background: linear-gradient(90deg, 
                var(--giyu-red) 0%, var(--giyu-red) 50%, 
                #eab308 50%, #15803d 75%, #eab308 100%);
            background-size: 40px 100%;
            box-shadow: 0 0 15px rgba(0, 245, 212, 0.4);
        }

        /* Cute Animated Glowing Text */
        .title-glow {
            text-shadow: 0 0 15px rgba(255, 133, 161, 0.8), 0 0 30px rgba(0, 245, 212, 0.5);
            background: linear-gradient(135deg, #ffffff 0%, #ffc2d1 50%, #00f5d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Cute Glassmorphism Card Style */
        .cute-glass-card {
            background: rgba(28, 37, 65, 0.65);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(0, 245, 212, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), inset 0 0 15px rgba(0, 245, 212, 0.1);
            border-radius: 2rem;
        }

        /* Water Bubble Particle Canvas */
        #waterCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Floating Animation */
        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }

        .animate-float {
            animation: gentleFloat 4s ease-in-out infinite;
        }

        /* Cute Pulse for Seconds */
        @keyframes heartPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .pulse-sec {
            animation: heartPulse 1s ease-in-out infinite;
        }
    </style>
</head>
<body class="flex flex-col justify-between min-h-screen relative" onclick="spawnClickBubble(event)">

    <!-- Main Container -->
    <main class="relative z-10 max-w-3xl mx-auto px-4 py-8 sm:py-12 flex-grow flex flex-col items-center justify-center text-center space-y-8">

        <!-- STREAMING_CHUNK: Cute Anime Badge & Character Motif -->
        <div class="animate-float space-y-3">
            <!-- Cute Badge -->
            <div class="inline-flex items-center gap-2 bg-gradient-to-r from-blue-600/40 via-cyan-500/30 to-teal-500/40 border border-cyan-400/60 px-4 py-1.5 rounded-full text-xs sm:text-sm font-bold text-cyan-200 shadow-lg backdrop-blur-md">
                <span class="text-base">🌊</span>
                <span>水之呼吸 · 壹之型：永远爱依晴</span>

            <!-- Giyu Haori Icon & Cute Header -->
            <div class="flex justify-center items-center gap-3 pt-2">

                        义勇
                    </div>
                </div>
                <span class="text-xs font-bold text-slate-300 tracking-wider">富冈义勇的专属守护信物</span>
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-green-700 to-cyan-500 p-0.5 shadow-md flex items-center justify-center">

                        依晴
                    </div>
                </div>
            </div>
        </div>

        <!-- STREAMING_CHUNK: Main Title - "我爱你 王依晴" -->
        <div class="space-y-2">
            <h1 class="text-5xl sm:text-7xl font-black title-glow tracking-tight leading-tight py-2">
                我爱你 王依晴
            </h1>
            <p class="text-sm sm:text-base text-cyan-200/80 font-medium max-w-md mx-auto">
                “即使水面波涛汹涌，我对你的心意也如深海般坚定不移。”
            </p>
        </div>

        <!-- STREAMING_CHUNK: Core Love Timer Display -->
        <section class="cute-glass-card p-6 sm:p-8 w-full max-w-2xl relative overflow-hidden space-y-6">
            <!-- Background Cute Glow -->
            <div class="absolute -top-12 -right-12 w-32 h-32 bg-cyan-400/20 rounded-full blur-2xl pointer-events-none"></div>
            <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-pink-500/20 rounded-full blur-2xl pointer-events-none"></div>

            <div class="flex items-center justify-center gap-2 text-xs sm:text-sm font-bold text-cyan-300 tracking-widest uppercase">
                <i class="fas fa-heart text-pink-400 animate-pulse"></i>
                <span>我们在一起已经</span>
                <i class="fas fa-heart text-pink-400 animate-pulse"></i>
            </div>

            <!-- Timer Grid Cards -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
                <!-- Days -->
                <div class="bg-slate-900/80 border border-cyan-500/30 p-4 rounded-2xl flex flex-col items-center justify-center shadow-inner">
                    <span id="days" class="text-4xl sm:text-5xl font-black text-cyan-300 font-mono tracking-tight">000</span>
                    <span class="text-xs text-slate-400 font-bold mt-1">天 (Days)</span>
                </div>
                <!-- Hours -->
                <div class="bg-slate-900/80 border border-cyan-500/30 p-4 rounded-2xl flex flex-col items-center justify-center shadow-inner">
                    <span id="hours" class="text-4xl sm:text-5xl font-black text-cyan-300 font-mono tracking-tight">00</span>
                    <span class="text-xs text-slate-400 font-bold mt-1">小时 (Hours)</span>
                </div>
                <!-- Minutes -->
                <div class="bg-slate-900/80 border border-cyan-500/30 p-4 rounded-2xl flex flex-col items-center justify-center shadow-inner">
                    <span id="minutes" class="text-4xl sm:text-5xl font-black text-cyan-300 font-mono tracking-tight">00</span>
                    <span class="text-xs text-slate-400 font-bold mt-1">分钟 (Mins)</span>
                </div>
                <!-- Seconds -->
                <div class="bg-slate-900/80 border border-pink-500/40 p-4 rounded-2xl flex flex-col items-center justify-center shadow-inner pulse-sec">
                    <span id="seconds" class="text-4xl sm:text-5xl font-black text-pink-400 font-mono tracking-tight">00</span>
                    <span class="text-xs text-pink-300/80 font-bold mt-1">秒 (Secs)</span>
                </div>
            </div>

            <!-- Start Date Label -->
            <div class="pt-2 border-t border-cyan-500/20 text-xs text-cyan-200/60 font-mono flex items-center justify-center gap-1">
                <i class="far fa-clock"></i>
                <span>始于 2024年6月22日 凌晨01:44</span>
            </div>
        </section>

        <!-- STREAMING_CHUNK: Chibi Giyu Anime Quote Box -->
        <section class="cute-glass-card p-5 w-full max-w-xl text-left flex items-center gap-4 relative">
            <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-gradient-to-br from-cyan-400 to-blue-600 flex-shrink-0 flex items-center justify-center text-2xl shadow-lg border-2 border-cyan-200">
                🌊
            </div>
            <div class="space-y-1">
                <div class="flex items-center gap-2">
                    <span class="font-extrabold text-sm text-cyan-300">富冈义勇</span>
                    <span class="text-[10px] bg-red-900/80 text-yellow-300 font-bold px-2 py-0.5 rounded-full border border-yellow-500/40">水柱限定</span>
                </div>
                <p class="text-xs sm:text-sm font-bold text-slate-200 leading-relaxed">
                    “我才没有被讨厌呢……因为我有依晴在呀！”
                </p>
            </div>
        </section>

        <!-- Interactive Button for Love Hearts Burst -->
        <button onclick="triggerLoveBurst()" class="bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-500 hover:from-pink-600 hover:to-cyan-600 text-white font-black text-sm px-6 py-3 rounded-2xl shadow-lg shadow-cyan-500/20 border border-white/20 transform active:scale-95 transition-all flex items-center gap-2">
            <i class="fas fa-magic"></i>
            <span>给依晴送个水之呼吸爱心！</span>
        </button>

    </main>

    <!-- Bottom Decorative Haori Bar & Simple Footer -->
    <footer class="relative z-10 py-6 text-center text-xs text-slate-400 space-y-2">
        <p>为 王依晴 专属定制 · 永远爱你的男朋友 💙</p>
        <div class="giyu-haori-bar mt-4"></div>
    </footer>

    <script>
        /* STREAMING_CHUNK: Precise Love Timer Logic & Canvas Bubble/Heart Animation */
        
        // Exact Love Start Time: June 22, 2024 at 01:44:00 AM
        const startDate = new Date('2024-06-22T01:44:00');

        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;

            if (diff < 0) return;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / (1000 * 60)) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById('days').innerText = String(days).padStart(3, '0');
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
            document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
        }

        setInterval(updateTimer, 1000);
        updateTimer();

        // Confetti Heart Burst
        function triggerLoveBurst() {
            confetti({
                particleCount: 50,
                spread: 70,
                origin: { y: 0.7 },
                colors: ['#00f5d4', '#ff85a1', '#3b82f6', '#facc15']
            });
            playSoftWaterTone();
        }

        // Web Audio Synthesizer (Cute Water Drop Sound)
        function playSoftWaterTone() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch(e){}
        }

        // Canvas Water Bubbles & Floating Hearts System
        const canvas = document.getElementById('waterCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = [];
        const particleCount = 25;

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 100;
                this.radius = Math.random() * 6 + 3;
                this.speedY = Math.random() * 1 + 0.5;
                this.speedX = Math.random() * 0.6 - 0.3;
                this.opacity = Math.random() * 0.5 + 0.3;
                this.isHeart = Math.random() > 0.6; // 40% hearts, 60% water bubbles
            }
            update() {
                this.y -= this.speedY;
                this.x += Math.sin(this.y * 0.02) + this.speedX;

                if (this.y < -20) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                if (this.isHeart) {
                    ctx.fillStyle = '#ff85a1';
                    ctx.font = `${this.radius * 2.5}px sans-serif`;
                    ctx.fillText('💖', this.x, this.y);
                } else {
                    // Water Bubble
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(0, 245, 212, 0.3)';
                    ctx.strokeStyle = 'rgba(0, 245, 212, 0.8)';
                    ctx.lineWidth = 1.5;
                    ctx.fill();
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        // Spawn Bubble on Click
        function spawnClickBubble(e) {
            playSoftWaterTone();
            for (let i = 0; i < 4; i++) {
                const p = new Particle();
                p.x = e.clientX + (Math.random() * 20 - 10);
                p.y = e.clientY + (Math.random() * 20 - 10);
                p.speedY = Math.random() * 2 + 1;
                particles.push(p);
                if (particles.length > 50) particles.shift();
            }
        }
    </script>
</body>
</html>
